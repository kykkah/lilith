pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = "logback-access-sandbox"

includeBuild('../..') {
    dependencySubstitution {
        substitute module('de.huxhorn.lilith:de.huxhorn.lilith.logback.appender.multiplex-access') using project(':logback:multiplex-appender-access')
        substitute module('de.huxhorn.lilith:de.huxhorn.lilith.logback.appender.multiplex-classic') using project(':logback:multiplex-appender-classic')
        substitute module('de.huxhorn.lilith:de.huxhorn.lilith.logback.encoder.access') using project(':logback:encoder-access')
        substitute module('de.huxhorn.lilith:de.huxhorn.lilith.logback.encoder.classic') using project(':logback:encoder-classic')
    }
}
